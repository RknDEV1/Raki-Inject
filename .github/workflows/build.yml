name: Build iOS app

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Rebuild Airlift FFI
        run: |
          sed -i '' 's/\r$//' ThreeOneOSFive/build-airlift-ffi.sh
          bash ThreeOneOSFive/build-airlift-ffi.sh

      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -project ThreeOneOSFive.xcodeproj
          -target Raki
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -configuration Debug
          CONFIGURATION_BUILD_DIR=$GITHUB_WORKSPACE/build-simulator/Build/Products/Debug-iphonesimulator
          CODE_SIGNING_ALLOWED=NO
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=YES
          build

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: Raki-ios-simulator
          path: build-simulator/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error

      - name: Build for iOS Device (unsigned IPA)
        run: >-
          xcodebuild
          -project ThreeOneOSFive.xcodeproj
          -target Raki
          -sdk iphoneos
          -configuration Release
          CONFIGURATION_BUILD_DIR=$GITHUB_WORKSPACE/build-device/Build/Products/Release-iphoneos
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Create unsigned IPA
        run: |
          ls -la build-device/Build/Products/Release-iphoneos/
          mkdir -p Payload
          APP_PATH=$(find build-device/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP_PATH"
          cp -R "$APP_PATH" Payload/Raki.app
          zip -qr Raki-unsigned.ipa Payload/
          rm -rf Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Raki-unsigned-ipa
          path: Raki-unsigned.ipa
          if-no-files-found: error
